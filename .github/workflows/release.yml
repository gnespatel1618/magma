# Build installers and attach them to a GitHub Release when you push a version tag.
# Example: bump "version" in package.json, commit, then:
#   git tag v0.1.0
#   git push origin main --tags

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS runner → mac targets only; avoids Windows/Linux tooling on this job
        run: npm run build && npx electron-builder --mac --publish always
